name: CI
# FICHERO GENERADO por `brotea quality sync` (quality/gate-ci.yml en la fábrica).
# No lo edites aquí: cambia el catálogo y re-sincroniza, o la próxima migración
# de flota pisará tus cambios.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sello de build + tests de la app + comprobación de tipos + build.
      # El script `test` lo materializa la misma capacidad, así que todos los
      # repos comprueban lo mismo y se actualizan en un sitio.
      - run: npm test

  docker:
    # Producción no construye con `npm ci`: construye con el Dockerfile. Verde
    # en CI no era prueba de despliegue verde — un symlink de node_modules
    # versionado tumbó un despliegue el 2026-08-01 con CI en verde. Este paso
    # construye exactamente lo que construirá Coolify.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen real
        run: docker build -t ci-check:${{ github.sha }} .
      # Que exista un fichero dentro de la imagen no prueba que la imagen
      # SIRVA. Y `test -f /usr/share/nginx/html/index.html` además daba por
      # hecho un runtime: nginx sirviendo estáticos. Cualquier app con
      # servidor propio (SSR, API) suspendía un gate GENERADO que el repo
      # tiene prohibido editar. Ahora el gate arranca la imagen y le habla:
      # vale para las dos formas y comprueba lo que de verdad importa.
      - name: La imagen sirve de verdad
        run: |
          # Contrato de servicio, en brotea.json. Por omisión, el estático de
          # siempre: nginx en el 80 y la raíz. Así el chequeo es el mismo para
          # toda la flota y un runtime distinto es un DATO, no otro workflow.
          port=$(jq -r '.runtime.port // 80' brotea.json)
          health=$(jq -r '.runtime.health // "/"' brotea.json)
          # Puerto efímero, no uno fijo: un 8080 ocupado en el runner haría
          # fallar el gate por una colisión que no tiene nada que ver con la app.
          docker run -d --name ci-app -p 127.0.0.1::"$port" ci-check:${{ github.sha }}
          addr=$(docker port ci-app "$port"/tcp | head -1)
          for _ in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "http://$addr$health" || true)
            [ "$code" = "200" ] && ok=1 && break
            sleep 1
          done
          # Los logs SIEMPRE: un contenedor que muere al arrancar sin logs
          # deja el fallo sin diagnóstico y obliga a reproducir en local.
          echo "--- docker logs ---"; docker logs ci-app 2>&1 | tail -50
          docker rm -f ci-app >/dev/null 2>&1 || true
          [ "${ok:-}" = "1" ] || {
            echo "::error::la imagen no sirve 200 en $health (puerto $port, último código: ${code:-sin respuesta})"
            exit 1
          }
